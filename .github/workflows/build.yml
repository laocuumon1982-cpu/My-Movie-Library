name: Build My Movie Library

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install pyinstaller
      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name "My Movie Library" --icon icon.ico
          --add-data "icon.ico;." app.py
      - name: Portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "portable/Data" | Out-Null
          Copy-Item "dist/My Movie Library.exe" "portable/"
          Copy-Item "Data/HUONG_DAN.txt" "portable/Data/"
          Copy-Item "README_PORTABLE.txt" "portable/README.txt"
          Compress-Archive -Path "portable/*" -DestinationPath "My-Movie-Library-Portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: My-Movie-Library
          path: |
            dist/My Movie Library.exe
            My-Movie-Library-Portable.zip
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path version.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "v=$v" >> $env:GITHUB_OUTPUT
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: My Movie Library v${{ steps.ver.outputs.v }}
          generate_release_notes: true
          files: |
            dist/My Movie Library.exe
            My-Movie-Library-Portable.zip
